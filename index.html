<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Таблица товаров</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="table-container">
    <h1>Список товаров</h1>

    <table class="styled-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Название</th>
          <th>Категория</th>
          <th>Цена</th>
          <th>Наличие</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Монитор Samsung 24"</td>
          <td>Техника</td>
          <td>₸ 65 000</td>
          <td><span class="status available">В наличии</span></td>
        </tr>
        <tr>
          <td>2</td>
          <td>Кабель HDMI 2м</td>
          <td>Аксессуары</td>
          <td>₸ 2 500</td>
          <td><span class="status preorder">Под заказ</span></td>
        </tr>
        <tr>
          <td>3</td>
          <td>Клавиатура Logitech</td>
          <td>Периферия</td>
          <td>₸ 9 800</td>
          <td><span class="status available">В наличии</span></td>
        </tr>
        <tr>
          <td>4</td>
          <td>Сетевой фильтр Defender</td>
          <td>Электрика</td>
          <td>₸ 4 200</td>
          <td><span class="status none">Нет в наличии</span></td>
        </tr>
        <tr>
            <td>5</td>
            <td>Морковка</td>
            <td>Овощи</td>
            <td>5000</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
